<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Systems Upgrade - BillSoft India</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --royal-blue: #3157a2;
            --yellow: #ffd700;
            --dark-blue: #1e3a75;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8faff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            border-top: 8px solid var(--royal-blue);
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            color: #000;
        }

        .logo span {
            color: var(--royal-blue);
        }

        .status-badge {
            display: inline-block;
            background-color: var(--yellow);
            color: var(--dark-blue);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--dark-blue);
            margin-bottom: 16px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #666;
            margin-bottom: 32px;
        }

        .icon-container {
            margin-bottom: 32px;
        }

        .icon-container svg {
            width: 120px;
            height: 120px;
            fill: var(--royal-blue);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .footer {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .progress-bar {
            height: 6px;
            width: 100%;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 40px;
        }

        .progress-fill {
            height: 100%;
            width: 70%;
            background: var(--royal-blue);
            border-radius: 10px;
            animation: progress 3s infinite ease-in-out;
        }

        @keyframes progress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Bill<span>Soft</span></div>
        <div class="status-badge">System Upgrade in Progress</div>
        
        <div class="icon-container">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

        </div>

        <h1>Enhancing Your Experience</h1>
        <p>We're currently performing some scheduled maintenance to improve our billing infrastructure. We'll be back online in just a few minutes.</p>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <div class="footer">
            &copy; 2026 BillSoft India • Powered by Agb Technologies
        </div>
    </div>
</body>
</html>
